<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Livre — Bibliothèque & lecture</title>
    <meta name="description" content="Gérez votre bibliothèque personnelle, suivez vos lectures et vos objectifs." />
    <meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100F0E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Livre" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      try {
        var t = localStorage.getItem('livre-theme') || 'system';
        var darks = ['dark', 'midnight', 'forest', 'amoled'];
        var sys = matchMedia('(prefers-color-scheme: dark)').matches;
        var id = t === 'system' ? (sys ? 'dark' : 'light') : t;
        if (darks.indexOf(id) >= 0) document.documentElement.classList.add('dark');
        if (id !== 'light' && id !== 'dark') document.documentElement.classList.add('theme-' + id);
      } catch (e) {}
    </script>
      <script>
      /* Mise à jour automatique Android : si une nouvelle interface ne démarre pas, retour à la précédente. */
      (function () {
        try {
          var C = window.Capacitor;
          if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
          var p = localStorage.getItem('livre-live-pending');
          if (!p) return;
          setTimeout(function () {
            if (localStorage.getItem('livre-live-ok') === p) return;
            var bad = JSON.parse(localStorage.getItem('livre-live-bad') || '[]');
            bad.push(Number(p));
            localStorage.setItem('livre-live-bad', JSON.stringify(bad));
            localStorage.removeItem('livre-live-pending');
            localStorage.removeItem('livre-live-ready');
            var W = C.Plugins && C.Plugins.WebView;
            var prev = localStorage.getItem('livre-live-prev') || '';
            if (!W) return;
            if (prev) W.setServerBasePath({ path: prev });
            else W.setServerAssetPath({ path: 'public' });
          }, 20000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
