name: APK Android

on:
  push:
    branches: [main, ccr-db212a0a-ratzwk]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Compilation de l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Livre.apk

      - name: APK en téléchargement (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Livre-apk
          path: Livre.apk

      - name: APK attaché à la release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Livre.apk
