name: APK Android

on:
  push:
    branches: [main, ccr-db212a0a-ratzwk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
        run: npm run build

      # Interface seule : téléchargée par l'app Android pour se mettre à jour sans réinstaller.
      - name: Paquet de mise à jour automatique
        run: cd dist && zip -qr "../livre-web-api$(tr -d '[:space:]' < ../native-api.txt).zip" .

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Compilation de l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Livre.apk

      - name: APK en téléchargement (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Livre-apk
          path: Livre.apk

      # Publie Livre.apk tel quel (sans zip) dans une release : le lien
      # https://github.com/<dépôt>/releases/latest/download/Livre.apk pointe toujours sur la dernière version.
      - name: Publication de l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Livre 1.0.${{ github.run_number }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Livre.apk
            livre-web-api*.zip
          body: |
            Application Android Livre.

            **Installer :** téléchargez `Livre.apk` ci-dessous sur votre téléphone, ouvrez-le, puis appuyez sur « Installer »
            (autorisez l'installation depuis cette source si Android le demande).
            Chaque nouvelle version s'installe par-dessus la précédente, sans perte de données.
            Une fois cette version installée, l'application se met à jour toute seule (fichier `livre-web-api*.zip`).
